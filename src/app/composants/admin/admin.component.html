<!-- ======================================================= -->
<!-- SIDEBAR                                                  -->
<!-- ======================================================= -->

<div
  class="fixed top-0 left-0
         h-screen
         z-40
         flex flex-col
         bg-gradient-to-b from-orange-600 to-orange-800
         text-white
         shadow-xl
         transition-all duration-300 ease-in-out"
  [ngClass]="{
    'w-72 translate-x-0': sidebarOpen,
    'w-20 -translate-x-full lg:translate-x-0': !sidebarOpen
  }">


  <!-- ======================================================= -->
  <!-- LOGO                                                     -->
  <!-- ======================================================= -->

  <div
    class="h-20 min-h-[80px]
           flex items-center
           px-5
           border-b border-white/20">

    <div
      class="w-11 h-11 min-w-[44px]
             bg-white rounded-xl
             flex items-center justify-center
             shadow-lg">

      <img
        src="/images/logo.png"
        class="w-8 h-8 object-contain"
        alt="Logo">

    </div>


    <div
      *ngIf="sidebarOpen"
      class="ml-3 overflow-hidden whitespace-nowrap">

      <h1 class="font-bold text-lg">
        Administration
      </h1>

      <p class="text-xs text-orange-100">
        Espace administrateur
      </p>

    </div>

  </div>



  <!-- ======================================================= -->
  <!-- BOUTON OUVRIR / FERMER                                   -->
  <!-- ======================================================= -->

  <button
    (click)="toggleSidebar()"
    class="absolute -right-3 top-7
           w-7 h-7
           rounded-full
           bg-white
           text-orange-600
           shadow-lg
           hidden lg:flex
           items-center justify-center
           hover:scale-110
           transition
           z-50">

    <i
      class="fa-solid"
      [ngClass]="sidebarOpen
        ? 'fa-chevron-left'
        : 'fa-chevron-right'">
    </i>

  </button>



  <!-- ======================================================= -->
  <!-- MENU                                                      -->
  <!-- ======================================================= -->

  <nav
    class="flex-1
           px-3 py-6
           overflow-y-auto
           overflow-x-hidden">

    <!-- ===================================================== -->
    <!-- TITRE                                                   -->
    <!-- ===================================================== -->

    <p
      *ngIf="sidebarOpen"
      class="px-3 mb-3
             text-xs font-semibold
             text-orange-200
             uppercase tracking-wider">

      Menu principal

    </p>



    <!-- ===================================================== -->
    <!-- DASHBOARD                                               -->
    <!-- ===================================================== -->

    <a
      routerLink="/admin/dashboard"
      (click)="closeSidebar()"
      routerLinkActive="bg-white/20 shadow-lg"
      class="flex items-center gap-4
             px-3 py-3 mb-2
             rounded-xl
             text-decoration-none
             text-white
             hover:bg-white/15
             transition-all duration-200
             group">

      <i
        class="fa-solid fa-chart-pie
               text-lg w-6
               text-center
               group-hover:scale-110
               transition">
      </i>

      <span
        *ngIf="sidebarOpen"
        class="font-medium whitespace-nowrap">

        Tableau de bord

      </span>

    </a>



    <!-- ===================================================== -->
    <!-- PUBLICATIONS                                            -->
    <!-- ===================================================== -->

    <a
      routerLink="/admin/publier"
      (click)="closeSidebar()"
      routerLinkActive="bg-white/20 shadow-lg"
      class="flex items-center gap-4
             px-3 py-3 mb-2
             rounded-xl
             hover:bg-white/15
             text-decoration-none
             text-white
             transition-all duration-200
             group">

      <i
        class="fa-solid fa-newspaper
               text-lg w-6
               text-center
               group-hover:scale-110
               transition">
      </i>

      <span
        *ngIf="sidebarOpen"
        class="font-medium whitespace-nowrap">

        Publier

      </span>

    </a>



    <!-- ===================================================== -->
    <!-- ARTICLES                                                -->
    <!-- ===================================================== -->

    <a
      routerLink="/admin/gestion"
      (click)="closeSidebar()"
      routerLinkActive="bg-white/20 shadow-lg"
      class="flex items-center gap-4
             px-3 py-3 mb-2
             rounded-xl
             hover:bg-white/15
             text-decoration-none
             text-white
             transition-all duration-200
             group">

      <i
        class="fa-solid fa-box-open
               text-lg w-6
               text-center
               group-hover:scale-110
               transition">
      </i>

      <span
        *ngIf="sidebarOpen"
        class="font-medium whitespace-nowrap">

        Gestion publications

      </span>

    </a>



    <!-- ===================================================== -->
    <!-- COMMANDES                                               -->
    <!-- ===================================================== -->

    <a
      routerLink="/admin/requetes-de-priere"
      (click)="closeSidebar()"
      routerLinkActive="bg-white/20 shadow-lg"
      class="flex items-center gap-4
             px-3 py-3 mb-2
             rounded-xl
             hover:bg-white/15
             text-decoration-none
             text-white
             transition-all duration-200
             group">

      <i
        class="fa-solid fa-envelope
               text-lg w-6
               text-center
               group-hover:scale-110
               transition">
      </i>

      <span
        *ngIf="sidebarOpen"
        class="font-medium whitespace-nowrap">

        Requêtes de prière

      </span>

    </a>



    <!-- ===================================================== -->
    <!-- UTILISATEURS                                            -->
    <!-- ===================================================== -->

    <a
      routerLink="/admin/utilisateurs"
      (click)="closeSidebar()"
      routerLinkActive="bg-white/20 shadow-lg"
      class="flex items-center gap-4
             px-3 py-3 mb-2
             rounded-xl
             hover:bg-white/15
             text-decoration-none
             text-white
             transition-all duration-200
             group">

      <i
        class="fa-solid fa-users
               text-lg w-6
               text-center
               group-hover:scale-110
               transition">
      </i>

      <span
        *ngIf="sidebarOpen"
        class="font-medium whitespace-nowrap">

        Utilisateurs

      </span>

    </a>



    <!-- ===================================================== -->
    <!-- SEPARATEUR                                              -->
    <!-- ===================================================== -->

    <div class="h-px bg-white/20 my-6"></div>



    <!-- ===================================================== -->
    <!-- CONFIGURATION                                           -->
    <!-- ===================================================== -->

    <p
      *ngIf="sidebarOpen"
      class="px-3 mb-3
             text-xs font-semibold
             text-orange-200
             uppercase tracking-wider">

      Configuration

    </p>



    <!-- ===================================================== -->
    <!-- PARAMETRES                                               -->
    <!-- ===================================================== -->

    <a
      routerLink="/admin/parametres"
      (click)="closeSidebar()"
      routerLinkActive="bg-white/20 shadow-lg"
      class="flex items-center gap-4
             px-3 py-3 mb-2
             rounded-xl
             hover:bg-white/15
             text-decoration-none
             text-white
             transition-all duration-200
             group">

      <i
        class="fa-solid fa-gear
               text-lg w-6
               text-center
               group-hover:rotate-90
               transition">
      </i>

      <span
        *ngIf="sidebarOpen"
        class="font-medium whitespace-nowrap">

        Paramètres

      </span>

    </a>

  </nav>



  <!-- ======================================================= -->
  <!-- PROFIL                                                    -->
  <!-- ======================================================= -->

  <div
    class="p-3
           border-t border-white/20
           flex-shrink-0">

    <div
      class="flex items-center gap-3
             p-3 rounded-xl
             bg-white/10">

      <!-- AVATAR -->

      <div
        class="w-10 h-10 min-w-[40px]
               rounded-full
               bg-white
               flex items-center
               justify-center
               text-orange-600">

        <i class="fa-solid fa-user"></i>

      </div>


      <!-- INFORMATIONS -->

      <div
        *ngIf="sidebarOpen"
        class="flex-1 overflow-hidden">

        <p class="font-semibold text-sm truncate">
          Administrateur
        </p>

        <p class="text-xs text-orange-100 truncate">
          adminexample.com
        </p>

      </div>

    </div>



    <!-- ===================================================== -->
    <!-- DECONNEXION                                             -->
    <!-- ===================================================== -->

    <button
      (click)="logout()"
      class="w-full mt-2
             flex items-center gap-4
             px-3 py-3
             rounded-xl
             text-orange-100
             hover:bg-red-500/30
             hover:text-white
             transition">

      <i
        class="fa-solid fa-right-from-bracket
               w-6 text-center">
      </i>

      <span
        *ngIf="sidebarOpen"
        class="font-medium">

        Déconnexion

      </span>

    </button>

  </div>

</div>



<!-- ======================================================= -->
<!-- CONTENU PRINCIPAL                                         -->
<!-- ======================================================= -->

<div
  class="transition-all duration-300"
  [ngClass]="{

    'lg:ml-72': sidebarOpen,

    'lg:ml-20': !sidebarOpen

  }">


  <!-- ======================================================= -->
  <!-- HEADER                                                    -->
  <!-- ======================================================= -->

  <header
    class="h-20
           bg-white
           border-b border-gray-200
           flex items-center
           justify-between
           px-4 sm:px-6 lg:px-8
           sticky top-0
           z-30">


    <!-- ===================================================== -->
    <!-- MOBILE                                                  -->
    <!-- ===================================================== -->

    <button
      (click)="toggleSidebar()"
      class="lg:hidden
             w-11 h-11
             rounded-xl
             bg-orange-50
             text-orange-600
             flex items-center
             justify-center
             hover:bg-orange-100
             transition">

      <i class="fa-solid fa-bars text-xl"></i>

    </button>



    <!-- ===================================================== -->
    <!-- TITRE                                                   -->
    <!-- ===================================================== -->

    <div class="hidden sm:block">

      <h2 class="text-xl font-bold text-gray-800">
        Administration
      </h2>

      <p class="text-sm text-gray-500">
        Gérez votre plateforme
      </p>

    </div>



    <!-- ===================================================== -->
    <!-- DROITE                                                  -->
    <!-- ===================================================== -->

    <div
      class="flex items-center gap-3 ml-auto">


      <!-- =================================================== -->
      <!-- NOTIFICATION                                         -->
      <!-- =================================================== -->

      <button
        class="relative
               w-11 h-11
               rounded-xl
               bg-gray-50
               text-gray-600
               hover:bg-orange-50
               hover:text-orange-600
               transition">

        <i class="fa-solid fa-bell"></i>

        <span
          class="absolute top-2 right-2
                 w-2.5 h-2.5
                 bg-red-500
                 rounded-full
                 border-2 border-white">
        </span>

      </button>



      <!-- =================================================== -->
      <!-- PROFIL                                                -->
      <!-- =================================================== -->

      <div
        class="hidden sm:flex
               items-center gap-3
               pl-3
               border-l border-gray-200">

        <div
          class="w-10 h-10
                 rounded-full
                 bg-gradient-to-br
                 from-orange-500
                 to-orange-800
                 text-white
                 flex items-center
                 justify-center">

          <i class="fa-solid fa-user"></i>

        </div>


        <div class="hidden md:block">

          <p class="text-sm font-semibold text-gray-800">
            Administrateur
          </p>

          <p class="text-xs text-gray-500">
            Compte admin
          </p>

        </div>

      </div>

    </div>

  </header>



  <!-- ======================================================= -->
  <!-- CONTENU QUI SCROLLE SEULEMENT                            -->
  <!-- ======================================================= -->

  <div
    class="h-[calc(100vh-5rem)]
           overflow-y-auto
           overflow-x-hidden
           p-4 sm:p-6 lg:p-8">

    <router-outlet></router-outlet>

  </div>

</div>
