<!-- admin.component.html -->

<!-- ======================================================= -->
<!-- FOND SOMBRE (MOBILE UNIQUEMENT, QUAND LE TIROIR EST OUVERT) -->
<!-- ======================================================= -->

<div
  *ngIf="mobileMenuOpen"
  (click)="closeMobileMenu()"
  class="fixed inset-0 z-30 bg-black/50 backdrop-blur-sm lg:hidden
         transition-opacity duration-300">
</div>

<!-- ======================================================= -->
<!-- SIDEBAR (STYLE HOSTINGER : FOND PLAT, ÉPURÉ)             -->
<!-- ======================================================= -->

<div
  class="fixed top-0 left-0
         h-screen w-72
         z-40
         flex flex-col
         bg-orange-600
         border-r border-black/10
         text-white
         transition-all duration-300 ease-in-out
         lg:translate-x-0"
  [ngClass]="{
    'translate-x-0': mobileMenuOpen,
    '-translate-x-full': !mobileMenuOpen,
    'lg:w-72': sidebarExpanded,
    'lg:w-[76px]': !sidebarExpanded
  }">


  <!-- ======================================================= -->
  <!-- LOGO                                                     -->
  <!-- ======================================================= -->

  <div
    class="h-16 min-h-[64px]
           flex items-center
           px-4
           flex-shrink-0">

    <div
      class="w-9 h-9 min-w-[36px]
             bg-white rounded-lg
             flex items-center justify-center">

      <img
        src="/images/logo.png"
        class="w-6 h-6 object-contain"
        alt="Logo">

    </div>


    <div
      *ngIf="afficherLabels"
      class="ml-2.5 overflow-hidden whitespace-nowrap flex-1">

      <h1 class="font-bold text-[15px] leading-tight">
        Fléchissons
      </h1>

      <p class="text-[11px] text-white/70 leading-tight">
        Espace administrateur
      </p>

    </div>


    <!-- FERMER (MOBILE UNIQUEMENT) -->
    <button
      *ngIf="afficherLabels"
      (click)="closeMobileMenu()"
      class="lg:hidden ml-auto w-8 h-8 min-w-[32px] rounded-lg
             flex items-center justify-center
             text-white/70 hover:bg-white/10 hover:text-white
             transition">
      <i class="fa-solid fa-xmark text-sm"></i>
    </button>

  </div>



  <!-- ======================================================= -->
  <!-- BOUTON REPLIER / ÉTENDRE (DESKTOP UNIQUEMENT)            -->
  <!-- ======================================================= -->

  <button
    (click)="toggleSidebar()"
    class="absolute -right-3 top-[52px]
           w-6 h-6
           rounded-full
           bg-white
           text-orange-600
           border border-orange-100
           hidden lg:flex
           items-center justify-center
           hover:scale-110
           transition
           z-50">

    <i
      class="fa-solid text-[10px]"
      [ngClass]="sidebarExpanded
        ? 'fa-chevron-left'
        : 'fa-chevron-right'">
    </i>

  </button>



  <!-- ======================================================= -->
  <!-- MENU                                                      -->
  <!-- ======================================================= -->

  <nav
    class="flex-1
           px-3 py-4
           overflow-y-auto
           overflow-x-hidden">

    <!-- ===================================================== -->
    <!-- TITRE                                                   -->
    <!-- ===================================================== -->

    <p
      *ngIf="afficherLabels"
      class="px-3 mb-2 mt-2
             text-[11px] font-semibold
             text-white/60
             uppercase tracking-wider">

      Menu principal

    </p>



    <!-- ===================================================== -->
    <!-- DASHBOARD                                               -->
    <!-- ===================================================== -->

    <a
      routerLink="/admin/dashboard"
      (click)="closeMobileMenu()"
      routerLinkActive
      #rlaDashboard="routerLinkActive"
      [ngClass]="rlaDashboard.isActive ? 'bg-white text-orange-600 font-semibold' : 'text-white/90 hover:bg-white/10'"
      class="flex items-center gap-3
             px-3 py-2.5 mb-1
             rounded-lg
             text-decoration-none
             text-sm
             transition-all duration-150">

      <i class="fa-solid fa-chart-pie text-[15px] w-5 text-center flex-shrink-0"></i>

      <span
        *ngIf="afficherLabels"
        class="whitespace-nowrap">

        Tableau de bord

      </span>

    </a>



    <!-- ===================================================== -->
    <!-- PUBLICATIONS                                            -->
    <!-- ===================================================== -->

    <a
      routerLink="/admin/publier"
      (click)="closeMobileMenu()"
      routerLinkActive
      #rlaPublier="routerLinkActive"
      [ngClass]="rlaPublier.isActive ? 'bg-white text-orange-600 font-semibold' : 'text-white/90 hover:bg-white/10'"
      class="flex items-center gap-3
             px-3 py-2.5 mb-1
             rounded-lg
             text-decoration-none
             text-sm
             transition-all duration-150">

      <i class="fa-solid fa-newspaper text-[15px] w-5 text-center flex-shrink-0"></i>

      <span
        *ngIf="afficherLabels"
        class="whitespace-nowrap">

        Publier

      </span>

    </a>



    <!-- ===================================================== -->
    <!-- ARTICLES                                                -->
    <!-- ===================================================== -->

    <a
      routerLink="/admin/gestion"
      (click)="closeMobileMenu()"
      routerLinkActive
      #rlaGestion="routerLinkActive"
      [ngClass]="rlaGestion.isActive ? 'bg-white text-orange-600 font-semibold' : 'text-white/90 hover:bg-white/10'"
      class="flex items-center gap-3
             px-3 py-2.5 mb-1
             rounded-lg
             text-decoration-none
             text-sm
             transition-all duration-150">

      <i class="fa-solid fa-box-open text-[15px] w-5 text-center flex-shrink-0"></i>

      <span
        *ngIf="afficherLabels"
        class="whitespace-nowrap">

        Gestion publications

      </span>

    </a>


    <!-- ===================================================== -->
    <!-- AUDIOS                                                  -->
    <!-- ===================================================== -->

    <a
      routerLink="/admin/audios"
      (click)="closeMobileMenu()"
      routerLinkActive
      #rlaAudios="routerLinkActive"
      [ngClass]="rlaAudios.isActive ? 'bg-white text-orange-600 font-semibold' : 'text-white/90 hover:bg-white/10'"
      class="flex items-center gap-3
             px-3 py-2.5 mb-1
             rounded-lg
             text-decoration-none
             text-sm
             transition-all duration-150">

      <i class="fa-solid fa-play text-[15px] w-5 text-center flex-shrink-0"></i>

      <span
        *ngIf="afficherLabels"
        class="whitespace-nowrap">

        Gestion audios

      </span>

    </a>



    <!-- ===================================================== -->
    <!-- REQUÊTES DE PRIÈRE                                      -->
    <!-- ===================================================== -->

    <a
      routerLink="/admin/requetes-de-priere"
      (click)="closeMobileMenu()"
      routerLinkActive
      #rlaRequetes="routerLinkActive"
      [ngClass]="rlaRequetes.isActive ? 'bg-white text-orange-600 font-semibold' : 'text-white/90 hover:bg-white/10'"
      class="flex items-center gap-3
             px-3 py-2.5 mb-1
             rounded-lg
             text-decoration-none
             text-sm
             transition-all duration-150">

      <i class="fa-solid fa-envelope text-[15px] w-5 text-center flex-shrink-0"></i>

      <span
        *ngIf="afficherLabels"
        class="whitespace-nowrap">

        Requêtes de prière

      </span>

    </a>



    <!-- ===================================================== -->
    <!-- GESTION ADMINISTRATEUR                                  -->
    <!-- ===================================================== -->

    <a
      routerLink="/admin/administrateurs"
      (click)="closeMobileMenu()"
      routerLinkActive
      #rlaAdministrateurs="routerLinkActive"
      [ngClass]="rlaAdministrateurs.isActive ? 'bg-white text-orange-600 font-semibold' : 'text-white/90 hover:bg-white/10'"
      class="flex items-center gap-3
             px-3 py-2.5 mb-1
             rounded-lg
             text-decoration-none
             text-sm
             transition-all duration-150">

      <i class="fa-solid fa-user-shield text-[15px] w-5 text-center flex-shrink-0"></i>

      <span
        *ngIf="afficherLabels"
        class="whitespace-nowrap">

        Gestion administrateur

      </span>

    </a>



    <!-- ===================================================== -->
    <!-- CONFIGURATION                                           -->
    <!-- ===================================================== -->

    <p
      *ngIf="afficherLabels"
      class="px-3 mb-2 mt-6
             text-[11px] font-semibold
             text-white/60
             uppercase tracking-wider">

      Configuration

    </p>



    <!-- ===================================================== -->
    <!-- PARAMETRES                                               -->
    <!-- ===================================================== -->

    <a
      routerLink="/admin/parametres"
      (click)="closeMobileMenu()"
      routerLinkActive
      #rlaParametres="routerLinkActive"
      [ngClass]="rlaParametres.isActive ? 'bg-white text-orange-600 font-semibold' : 'text-white/90 hover:bg-white/10'"
      class="flex items-center gap-3
             px-3 py-2.5 mb-1
             rounded-lg
             text-decoration-none
             text-sm
             transition-all duration-150">

      <i class="fa-solid fa-gear text-[15px] w-5 text-center flex-shrink-0"></i>

      <span
        *ngIf="afficherLabels"
        class="whitespace-nowrap">

        Paramètres

      </span>

    </a>

  </nav>



  <!-- ======================================================= -->
  <!-- PROFIL                                                    -->
  <!-- ======================================================= -->

  <div
    class="p-3
           border-t border-white/15
           flex-shrink-0">

    <div
      class="flex items-center gap-2.5
             px-2 py-2 rounded-lg
             hover:bg-white/10
             transition cursor-default">

      <!-- AVATAR -->

      <div
        class="w-8 h-8 min-w-[32px]
               rounded-full
               bg-white
               flex items-center
               justify-center
               text-orange-600
               text-xs">

        <i class="fa-solid fa-user"></i>

      </div>


      <!-- INFORMATIONS -->

      <div
        *ngIf="afficherLabels"
        class="flex-1 overflow-hidden">

        <p class="font-semibold text-xs truncate">
          {{ adminName }}
        </p>

        <p class="text-[11px] text-white/70 truncate">
          {{ adminEmail }}
        </p>

      </div>

    </div>



    <!-- ===================================================== -->
    <!-- DECONNEXION                                             -->
    <!-- ===================================================== -->

    <button
      (click)="logout()"
      class="w-full mt-0.5
             flex items-center gap-3
             px-3 py-2.5
             rounded-lg
             text-sm
             text-white/80
             hover:bg-black/10
             hover:text-white
             transition">

      <i class="fa-solid fa-right-from-bracket text-[15px] w-5 text-center flex-shrink-0"></i>

      <span
        *ngIf="afficherLabels">

        Déconnexion

      </span>

    </button>

  </div>

</div>



<!-- ======================================================= -->
<!-- CONTENU PRINCIPAL                                         -->
<!-- ======================================================= -->

<div
  class="transition-all duration-300"
  [ngClass]="{

    'lg:ml-72': sidebarExpanded,

    'lg:ml-[76px]': !sidebarExpanded

  }">


  <!-- ======================================================= -->
  <!-- HEADER                                                    -->
  <!-- ======================================================= -->

  <header
    class="h-20
           bg-white
           border-b border-gray-200
           flex items-center
           justify-between
           px-4 sm:px-6 lg:px-8
           sticky top-0
           z-30">


    <!-- ===================================================== -->
    <!-- MOBILE                                                  -->
    <!-- ===================================================== -->

    <button
      (click)="toggleMobileMenu()"
      class="lg:hidden
             w-11 h-11
             rounded-xl
             bg-orange-50
             text-orange-600
             flex items-center
             justify-center
             hover:bg-orange-100
             transition
             flex-shrink-0">

      <i class="fa-solid fa-bars text-xl"></i>

    </button>



    <!-- ===================================================== -->
    <!-- TITRE                                                   -->
    <!-- ===================================================== -->

    <div class="hidden sm:block">

      <h2 class="text-xl font-bold text-gray-800">
        Administration
      </h2>

      <p class="text-sm text-gray-500">
        Gérez votre plateforme
      </p>

    </div>



    <!-- ===================================================== -->
    <!-- DROITE                                                  -->
    <!-- ===================================================== -->

    <div
      class="flex items-center gap-3 ml-auto">


      <!-- =================================================== -->
      <!-- NOTIFICATION                                         -->
      <!-- =================================================== -->

      <button
        class="relative
               w-11 h-11
               rounded-xl
               bg-gray-50
               text-gray-600
               hover:bg-orange-50
               hover:text-orange-600
               transition">

        <i class="fa-solid fa-bell"></i>

        <span
          class="absolute top-2 right-2
                 w-2.5 h-2.5
                 bg-red-500
                 rounded-full
                 border-2 border-white">
        </span>

      </button>



      <!-- =================================================== -->
      <!-- PROFIL                                                -->
      <!-- =================================================== -->

      <div
        class="hidden sm:flex
               items-center gap-3
               pl-3
               border-l border-gray-200">

        <div
          class="w-10 h-10
                 rounded-full
                 bg-orange-600
                 text-white
                 flex items-center
                 justify-center">

          <i class="fa-solid fa-user"></i>

        </div>


        <div class="hidden md:block">

          <p class="text-sm font-semibold text-gray-800">
            {{ adminName }}
          </p>

          <p class="text-xs text-gray-500">
            {{ adminEmail }}
          </p>

        </div>

      </div>

    </div>

  </header>



  <!-- ======================================================= -->
  <!-- CONTENU QUI SCROLLE SEULEMENT                            -->
  <!-- ======================================================= -->

  <div
    class="h-[calc(100vh-5rem)]
           overflow-y-auto
           overflow-x-hidden
           p-4 sm:p-6 lg:p-8">

    <router-outlet></router-outlet>

  </div>

</div>
