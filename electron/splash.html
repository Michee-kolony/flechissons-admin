<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Fléchissons Admin</title>
  <style>
    :root {
      --orange: #f39200;
      --orange-clair: #ffb547;
      --fond: #ffffff;
      --texte: #1f1f1f;
      --texte-doux: #7a7a7a;
      --piste: #f1ece4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #17171a;
        --texte: #f5f5f5;
        --texte-doux: #9a9aa2;
        --piste: #2a2a30;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }

    .carte {
      position: absolute;
      inset: 14px;
      border-radius: 18px;
      background: var(--fond);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .22), 0 0 0 1px rgba(0, 0, 0, .06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: apparition .5s cubic-bezier(.2, .8, .2, 1) both;
    }
    /* Halo orangé discret derrière le logo */
    .carte::before {
      content: "";
      position: absolute;
      width: 340px; height: 340px;
      top: -110px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(243, 146, 0, .16), transparent 65%);
    }
    /* Liseré de marque en haut */
    .carte::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--orange), var(--orange-clair), var(--orange));
    }

    .logo {
      position: relative;
      width: 150px; height: 150px;
      animation: respiration 2.8s ease-in-out infinite, entree .7s .1s cubic-bezier(.2, .8, .2, 1) both;
    }
    @media (prefers-color-scheme: dark) {
      .logo { background: #fff; border-radius: 50%; padding: 6px; }
    }

    h1 {
      margin-top: 14px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: .3px;
      color: var(--texte);
      animation: entree .6s .25s both;
    }
    h1 span { color: var(--orange); }

    .sous-titre {
      margin-top: 4px;
      font-size: 12.5px;
      color: var(--texte-doux);
      letter-spacing: 1.6px;
      text-transform: uppercase;
      animation: entree .6s .35s both;
    }

    .chargement {
      margin-top: 26px;
      width: 220px;
      animation: entree .6s .45s both;
    }
    .piste {
      height: 4px;
      border-radius: 4px;
      background: var(--piste);
      overflow: hidden;
      position: relative;
    }
    .barre {
      position: absolute;
      top: 0; bottom: 0;
      width: 40%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--orange), var(--orange-clair));
      animation: glisse 1.4s ease-in-out infinite;
    }
    .statut {
      margin-top: 10px;
      font-size: 12px;
      color: var(--texte-doux);
      text-align: center;
      min-height: 16px;
      transition: opacity .25s;
    }

    .version {
      position: absolute;
      bottom: 14px;
      font-size: 11px;
      color: var(--texte-doux);
      opacity: .8;
    }

    @keyframes apparition {
      from { opacity: 0; transform: scale(.96); }
      to { opacity: 1; transform: none; }
    }
    @keyframes entree {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes respiration {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }
    @keyframes glisse {
      0% { left: -40%; }
      100% { left: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="carte">
    <img class="logo" src="icon.png" alt="">
    <h1>Fléchissons <span>Admin</span></h1>
    <p class="sous-titre">Espace d'administration</p>
    <div class="chargement">
      <div class="piste"><div class="barre"></div></div>
      <p class="statut" id="statut">Démarrage…</p>
    </div>
    <p class="version" id="version"></p>
  </div>

  <script>
    const v = new URLSearchParams(location.search).get('v');
    if (v) document.getElementById('version').textContent = 'Version ' + v;

    const messages = ['Démarrage…', 'Chargement de l’interface…', 'Préparation de votre espace…'];
    const statut = document.getElementById('statut');
    let i = 0;
    setInterval(() => {
      if (i >= messages.length - 1) return;
      statut.style.opacity = 0;
      setTimeout(() => { statut.textContent = messages[++i]; statut.style.opacity = 1; }, 250);
    }, 1100);
  </script>
</body>
</html>
